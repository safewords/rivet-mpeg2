[package]
name = "rivet-mpeg2"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/rivet-transcoder/rivet-mpeg2"
homepage = "https://github.com/rivet-transcoder/rivet-mpeg2"
documentation = "https://docs.rs/rivet-mpeg2"
authors = ["Ely Erin Fox"]
description = "An MPEG-2 Video (ITU-T H.262 / ISO/IEC 13818-2) decoder and encoder in Rust, written from the Recommendation: no C, no system libraries, no build script. Main and 4:2:2 profile decoding — frame and field pictures, every motion type, MPEG-1 video too — and a Main Profile I/P/B encoder. rivet's MPEG-2 codec. Imported as `mpeg2`."
keywords = ["mpeg2", "h262", "video", "decoder", "encoder"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = [".github/", "docs/", "tools/"]

[lib]
name = "mpeg2"

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The SIMD kernels are checked against the scalar code (AVX2 /
        # AVX-512 / SSE2 on x86-64; NEON is checked by hand on ARM hardware,
        # see the README), and the whole suite runs again on the scalar code.
        # MPEG2_REQUIRE_SIMD makes a host without the expected rung (AVX2) a
        # failure, not a silent comparison of the scalar code with itself.
        include:
          - { name: linux x86-64,   os: safewords-runners }
    env:
      MPEG2_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests (SIMD kernels)
        run: cargo test --release
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          MPEG2_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Kernel timings (informational)
        run: cargo run --release --example mpeg2_kernels

  # The ISO/IEC 13818-4 conformance bitstreams are not committed: ISO
  # publishes them, tools/fetch-conformance.sh downloads them, and this job
  # fails (rather than skips) if they are missing.
  conformance:
    name: ISO/IEC 13818-4 conformance bitstreams (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: target/conformance
          key: mpeg2-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh target/conformance
      # Every frame of every stream is hashed and compared with the recorded
      # output, decoded on 1, 2, 3 and 8 threads: with the SIMD kernels, then
      # with the scalar ones.
      - name: Conformance (SIMD kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG2_CONFORMANCE_DIR: target/conformance
          MPEG2_REQUIRE_CONFORMANCE: "1"
          MPEG2_REQUIRE_SIMD: "1"
          MPEG2_TEST_THREADS: "1,2,3,8"
      - name: Conformance (scalar kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG2_CONFORMANCE_DIR: target/conformance
          MPEG2_REQUIRE_CONFORMANCE: "1"
          MPEG2_FORCE_SCALAR: "1"
          MPEG2_TEST_THREADS: "1,4"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: rustfmt, clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-mpeg2
      submodule: crates/mpeg2

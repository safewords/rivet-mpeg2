name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The SIMD kernels are checked against the scalar code on every
        # host (AVX2 / AVX-512 / SSE2 on x86-64, NEON on arm64), and the
        # whole suite runs again on the scalar code. MPEG2_REQUIRE_SIMD makes
        # a host without the expected rung (AVX2, NEON) a failure, not a
        # silent comparison of the scalar code with itself.
        include:
          - { name: linux x86-64,   os: safewords-runners }
          - { name: linux arm64 under QEMU,    os: safewords-runners, target: aarch64-unknown-linux-gnu }
    env:
      MPEG2_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Tests (SIMD kernels)
        run: cargo test --release
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          MPEG2_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Kernel timings (informational)
        run: cargo run --release --example kernels

  # The ISO/IEC 13818-4 conformance bitstreams are not committed: ISO
  # publishes them, tools/fetch-conformance.sh downloads them, and this job
  # fails (rather than skips) if they are missing.
  conformance:
    name: ISO/IEC 13818-4 conformance bitstreams (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
          - { name: arm64 NEON under QEMU, os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/conformance
          key: mpeg2-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh target/conformance
      # Every frame of every stream is hashed and compared with the recorded
      # output, decoded on 1, 2, 3 and 8 threads: with the SIMD kernels, then
      # with the scalar ones.
      - name: Conformance (SIMD kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG2_CONFORMANCE_DIR: target/conformance
          MPEG2_REQUIRE_CONFORMANCE: "1"
          MPEG2_REQUIRE_SIMD: "1"
          MPEG2_TEST_THREADS: "1,2,3,8"
      - name: Conformance (scalar kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG2_CONFORMANCE_DIR: target/conformance
          MPEG2_REQUIRE_CONFORMANCE: "1"
          MPEG2_FORCE_SCALAR: "1"
          MPEG2_TEST_THREADS: "1,4"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

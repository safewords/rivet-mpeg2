name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: ubuntu-latest }
          - { name: linux arm64,    os: ubuntu-24.04-arm }
          - { name: windows x86-64, os: windows-latest }
          - { name: macos arm64,    os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz

  # The ISO/IEC 13818-4 conformance bitstreams are not committed: ISO
  # publishes them, tools/fetch-conformance.sh downloads them, and this job
  # fails (rather than skips) if they are missing.
  conformance:
    name: ISO/IEC 13818-4 conformance bitstreams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/conformance
          key: mpeg2-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh target/conformance
      - name: Conformance
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG2_CONFORMANCE_DIR: target/conformance
          MPEG2_REQUIRE_CONFORMANCE: "1"

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
